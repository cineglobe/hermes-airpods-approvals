name: airpods-approvals
title: AirPods Approvals
repo: https://github.com/cineglobe/hermes-airpods-approvals
sha: <full 40-character commit sha>
description: >-
  Hear Hermes approvals and questions in your AirPods and answer with your head: nod to approve,
  shake to deny. Gestures are recognised by rhythm, with a tap in each ear as you go, and drive the
  real approval through approval.respond. A nod only ever approves once, and a timeout or lost
  AirPods sends nothing. Needs a small native helper, built from source on your Mac, because head
  motion isn't reachable from a plugin. Disclosure — the helper runs in the menu bar while Desktop
  is connected, listens on 127.0.0.1 with a paired handshake, and reads head motion only during a
  question, which never leaves the Mac. No network use by default: the Mac's voice reads prompts.
  With an optional Gemini key on the Hermes backend, the sentence being read, including the
  approval's redacted command, is sent to generativelanguage.googleapis.com. On Gemini's free tier,
  Google may use this content to improve its products. No telemetry.
